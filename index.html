<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- 1. Preload the Largest Contentful Paint (LCP) Image -->
    <link rel="preload" as="image" href="/favicon.svg" fetchpriority="high" type="image/svg+xml" />
    <link rel="preload" as="image" href="/favicon.png" fetchpriority="high" type="image/png" />

    <!-- 2. Preconnect to Essential External Domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin />
    <link rel="preconnect" href="https://googleads.g.doubleclick.net" crossorigin />

    <!-- 3. Inline Critical CSS (Immediate FCP & Zero-CLS Layout Stabilization) -->
    <style>
      /* Critical Layout Base & Theme Tokens (Light + Dark) */
      :root {
        --font-fallback: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        --bg-page: #F6F8FC;
        --bg-surface: #FFFFFF;
        --bg-card: #FFFFFF;
        --bg-subtle: #EEF2F8;
        --bg-header: #101A36;
        --bg-header-dark: #0B1226;
        --text-primary: #101A36;
        --text-secondary: #475569;
        --text-muted: #64748B;
        --border-default: #DCE3EE;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root:not(.light) {
          --bg-page: #0B1120;
          --bg-surface: #111A2E;
          --bg-card: #16213A;
          --bg-subtle: #1E2C4A;
          --bg-header: #0A1124;
          --bg-header-dark: #060B18;
          --text-primary: #F1F5F9;
          --text-secondary: #CBD5E1;
          --text-muted: #94A3B8;
          --border-default: #283757;
        }
      }
      html.dark {
        --bg-page: #0B1120;
        --bg-surface: #111A2E;
        --bg-card: #16213A;
        --bg-subtle: #1E2C4A;
        --bg-header: #0A1124;
        --bg-header-dark: #060B18;
        --text-primary: #F1F5F9;
        --text-secondary: #CBD5E1;
        --text-muted: #94A3B8;
        --border-default: #283757;
        color-scheme: dark;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html {
        width: 100%;
        max-width: 100%;
        font-size: 16px;
        overflow-x: hidden !important;
        background-color: var(--bg-page);
        color: var(--text-primary);
        font-family: 'Inter', 'Noto Sans Devanagari', var(--font-fallback);
        text-size-adjust: 100%;
        -webkit-text-size-adjust: 100%;
        scroll-behavior: smooth;
      }
      html[dir="rtl"],
      html[lang="ur"] {
        font-family: 'Noto Nastaliq Urdu', 'Inter', serif;
      }
      body {
        width: 100%;
        max-width: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden !important;
        background-color: var(--bg-page);
        color: var(--text-primary);
        font-size: 1rem;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      html[dir="rtl"] body {
        line-height: 2.0;
      }
      #root {
        width: 100%;
        max-width: 100%;
        min-height: 100vh;
        overflow-x: hidden !important;
        background-color: var(--bg-page);
        display: flex;
        flex-direction: column;
      }

      /* Critical Header Skeleton (Prevents Layout Shift) */
      .critical-main-header {
        background-color: var(--bg-header);
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        min-height: 56px;
      }

      /* Anti-CLS Dynamic Cards & Module Baseline Heights */
      .sarkari-table-card,
      .service-card-item,
      .bulletin-card-item {
        min-height: 140px;
        contain: content;
      }
      .sarkari-desk-container {
        min-height: 480px;
      }
      .service-catalogue-container {
        min-height: 420px;
      }
      .scheme-grid-item {
        min-height: 160px;
      }
      .gallery-grid-item {
        min-height: 220px;
      }

      /* Image Layout Shift Prevention */
      img {
        max-width: 100%;
        height: auto;
        font-style: italic;
        vertical-align: middle;
        shape-margin: 0.75rem;
      }
    </style>
