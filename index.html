    <!-- 1. Preload the Largest Contentful Paint (LCP) Image -->
    <link rel="preload" as="image" href="/favicon.svg" fetchpriority="high" type="image/svg+xml" />
    <link rel="preload" as="image" href="/favicon.png" fetchpriority="high" type="image/png" />

    <!-- 2. Preconnect to Essential External Domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin />
    <link rel="preconnect" href="https://googleads.g.doubleclick.net" crossorigin />

    <!-- 3. Inline Critical CSS (Immediate FCP & Zero-CLS Layout Stabilization) -->
    <style>
      /* Critical Layout Base & Background */
      :root {
        --font-fallback: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        color-scheme: light;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden !important;
        background-color: #f8fafc !important;
        color: #0f172a !important;
        font-family: 'Inter', var(--font-fallback);
        text-size-adjust: 100%;
        -webkit-text-size-adjust: 100%;
        scroll-behavior: smooth;
      }
      body {
        width: 100%;
        max-width: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden !important;
        background-color: #f8fafc !important;
        color: #0f172a !important;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        width: 100%;
        max-width: 100%;
        min-height: 100vh;
        overflow-x: hidden !important;
        background-color: #f8fafc !important;
        display: flex;
        flex-direction: column;
      }

      /* Critical Top Navigation & Hero Skeleton (Prevents Layout Shift) */
      .critical-top-bar {
        background-color: #0f172a;
        color: #ffffff;
        padding: 4px 12px;
        min-height: 32px;
      }
      .critical-main-header {
        background: linear-gradient(to right, #18204e, #1c2661, #171e4a);
        color: #ffffff;
        padding: 14px 16px;
        min-height: 76px;
      }
      .critical-nav-bar {
        background-color: #ffffff;
        border-bottom: 1px solid #e2e8f0;
        min-height: 48px;
      }

      /* Anti-CLS Dynamic Cards & Module Baseline Heights */
      .sarkari-table-card,
      .service-card-item,
      .bulletin-card-item {
        min-height: 140px;
        contain: content;
      }
      .sarkari-desk-container {
        min-height: 480px;
      }
      .service-catalogue-container {
        min-height: 420px;
      }
      .scheme-grid-item {
        min-height: 160px;
      }
      .gallery-grid-item {
        min-height: 220px;
      }

      /* Image Layout Shift Prevention */
      img {
        max-width: 100%;
        height: auto;
        font-style: italic;
        vertical-align: middle;
        shape-margin: 0.75rem;
      }
    </style>

    <!-- 4. Load Non-Critical Google Fonts Asynchronously -->

      rel="preload"

      as="style"
