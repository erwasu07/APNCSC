    <line x1="18" y1="68" x2="302" y2="68" stroke="#b45309" stroke-width="1"/>
    <text x="18" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#e2e8f0">
