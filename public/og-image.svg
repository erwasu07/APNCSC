<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic Gold Gradient for Indian Army -->
    <linearGradient id="goldMetallicGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B27" />
      <stop offset="35%" stop-color="#F5DE7B" />
      <stop offset="70%" stop-color="#ECC657" />
      <stop offset="100%" stop-color="#B3861B" />
    </linearGradient>

    <!-- Subtle Clean Background Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>

    <filter id="brandPillShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Clean Pure White Background -->
  <rect width="1200" height="630" fill="#FFFFFF" />

  <!-- TOP RIGHT: OFFICIAL LOGO CONTAINER -->
  <g transform="translate(915, 45)">
    <rect x="0" y="0" width="235" height="235" rx="22" fill="#F8FAFC" stroke="#0B2545" stroke-width="2.5" stroke-dasharray="7,7" />
    <g transform="translate(68, 55)">
      <rect x="0" y="0" width="98" height="74" rx="10" fill="none" stroke="#0B2545" stroke-width="3" />
      <circle cx="74" cy="24" r="8" fill="#0B2545" />
      <path d="M 12 60 L 38 28 L 56 48 L 68 36 L 86 60 Z" fill="none" stroke="#0B2545" stroke-width="3" stroke-linejoin="round" />
      <text x="50" y="117" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-weight="900" font-size="22" fill="#0B2545" text-anchor="middle" letter-spacing="1">OFFICIAL</text>
      <text x="50" y="147" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-weight="900" font-size="22" fill="#0B2545" text-anchor="middle" letter-spacing="1">LOGO</text>
    </g>
  </g>

  <!-- TOP LEFT / CENTER: ORGANIZATION HEADING & POST TITLE PILL -->
  <g transform="translate(0, 0)">
    <!-- Radiating burst ticks for JKSSB / RRB / SSC / CUS -->
    
    <!-- Left Burst Ticks -->
    <g stroke="#028090" stroke-width="7" stroke-linecap="round">
      <line x1="85" y1="120" x2="60" y2="105" />
      <line x1="80" y1="145" x2="50" y2="145" />
      <line x1="85" y1="170" x2="60" y2="185" />
    </g>
    <!-- Right Burst Ticks (positioned before the logo box) -->
    <g stroke="#028090" stroke-width="7" stroke-linecap="round">
      <line x1="835" y1="120" x2="860" y2="105" />
      <line x1="840" y1="145" x2="870" y2="145" />
      <line x1="835" y1="170" x2="860" y2="185" />
    </g>
    

    <!-- Organization Name -->
    <text x="460" y="145" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-weight="900" font-size="76" fill="#0B2545" text-anchor="middle" letter-spacing="-0.5">
      KASHMIR UNIVERSITY
    </text>

    <!-- Post Title / Role Pill Banner -->
    <g transform="translate(97, 180)" filter="url(#softShadow)">
      <rect x="0" y="0" width="726" height="92" rx="26" fill="#028090" stroke="none" stroke-width="0" />
      <text x="363" y="65" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-weight="900" font-size="50" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
        OFFICIAL UPDATES, EXAM
      </text>
    </g>
  </g>

  <!-- MIDDLE ROW: 3 INFORMATION BLOCKS -->
  <!-- CARD 1: ELIGIBILITY -->
  <g transform="translate(45, 335)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="345" height="120" rx="18" fill="#F0F9F9" stroke="#BDE5E8" stroke-width="1.5" />
    <!-- Circle Icon -->
    <circle cx="56" cy="60" r="30" fill="#0B2545" />
    <!-- Document Icon inside Circle -->
    <g transform="translate(42, 45)" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="3" width="18" height="24" rx="2" />
      <line x1="9" y1="9" x2="19" y2="9" />
      <line x1="9" y1="14" x2="19" y2="14" />
      <line x1="9" y1="19" x2="15" y2="19" />
    </g>
    <!-- Vertical Separator Line -->
    <line x1="102" y1="28" x2="102" y2="92" stroke="#BDE5E8" stroke-width="1.5" />
    <!-- Text Labels -->
    <text x="118" y="48" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-weight="800" font-size="20" fill="#0B2545">
      Eligibility:
    </text>
    <text x="118" y="80" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-weight="700" font-size="18" fill="#1E293B">
      All Citizens
    </text>
  </g>

  <!-- CARD 2: LAST DATE -->
  <g transform="translate(425, 335)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="350" height="120" rx="18" fill="#F0F5FA" stroke="#C9D8E8" stroke-width="1.5" />
    <!-- Circle Icon -->
    <circle cx="56" cy="60" r="30" fill="#028090" />
    <!-- Calendar Icon inside Circle -->
    <g transform="translate(42, 45)" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="5" width="20" height="19" rx="2" />
      <line x1="4" y1="11" x2="24" y2="11" />
      <line x1="9" y1="2" x2="9" y2="6" />
      <line x1="19" y1="2" x2="19" y2="6" />
    </g>
    <!-- Vertical Separator Line -->
    <line x1="102" y1="28" x2="102" y2="92" stroke="#C9D8E8" stroke-width="1.5" />
    <!-- Text Labels -->
    <text x="118" y="48" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-weight="800" font-size="20" fill="#028090">
      Last date:
    </text>
    <text x="118" y="80" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-weight="700" font-size="18" fill="#1E293B">
      Active Updates
    </text>
  </g>

  <!-- CARD 3: HOW TO APPLY -->
  <g transform="translate(810, 335)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="345" height="120" rx="18" fill="#F0F9F9" stroke="#BDE5E8" stroke-width="1.5" />
    <!-- Circle Icon -->
    <circle cx="56" cy="60" r="30" fill="#0B2545" />
    <!-- Cursor Pointer Icon inside Circle -->
    <g transform="translate(43, 46)">
      <path d="M 6 4 L 20 18 L 13 19 L 17 26 L 14 28 L 10 20 L 6 24 Z" fill="#FFFFFF" />
    </g>
    <!-- Vertical Separator Line -->
    <line x1="102" y1="28" x2="102" y2="92" stroke="#BDE5E8" stroke-width="1.5" />
    <!-- Text Labels -->
    <text x="118" y="48" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-weight="800" font-size="20" fill="#0B2545">
      How to apply:
    </text>
    <text x="118" y="80" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-weight="700" font-size="18" fill="#1E293B">
      Visit CSC DOST
    </text>
  </g>

  <!-- BOTTOM LAYER: DUAL WAVING RIBBONS -->
  <!-- 1. Secondary Ribbon Wave (Top Accent) -->
  <path d="M 0 520 Q 300 480, 600 525 T 1200 490 L 1200 528 Q 900 560, 600 545 T 0 538 Z" fill="#028090" />
  <!-- 2. Primary Wave (Bottom Solid Base) -->
  <path d="M 0 534 Q 300 495, 600 540 T 1200 504 L 1200 630 L 0 630 Z" fill="#0B2545" />

  <!-- CENTERED BOTTOM BRAND PILL -->
  <g transform="translate(375, 532)" filter="url(#brandPillShadow)">
    <rect x="0" y="0" width="450" height="58" rx="29" fill="#081C35" stroke="#FFFFFF" stroke-width="2" />
    
    <!-- Left Accent Dash -->
    <line x1="35" y1="29" x2="105" y2="29" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Centered Brand Domain -->
    <text x="225" y="39" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-weight="900" font-size="26" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">
      cscdost.com
    </text>

    <!-- Right Accent Dash -->
    <line x1="345" y1="29" x2="415" y2="29" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>