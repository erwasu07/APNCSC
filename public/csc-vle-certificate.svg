<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Georgia', 'Times New Roman', serif; font-size: 38px; font-weight: bold; font-style: italic; fill: #0f4c81; text-anchor: middle; }
      .label { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; fill: #1e293b; letter-spacing: 2px; }
      .value { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #000000; }
      .footer-text { font-family: 'Arial', sans-serif; font-size: 11px; fill: #334155; text-anchor: middle; }
      .bold-footer { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; fill: #000000; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="750" fill="#ffffff" />

  <!-- Outer Ornate Blue Frame -->
  <rect x="20" y="20" width="960" height="710" fill="none" stroke="#60a5fa" stroke-width="6" rx="8" />
  <rect x="28" y="28" width="944" height="694" fill="none" stroke="#2563eb" stroke-width="2" rx="6" />
  
  <!-- Decorative Corner Swirls -->
  <path d="M 30,80 Q 80,80 80,30 M 970,80 Q 920,80 920,30 M 30,670 Q 80,670 80,720 M 970,670 Q 920,670 920,720" fill="none" stroke="#3b82f6" stroke-width="3" />
  <path d="M 40,100 Q 100,100 100,40 M 960,100 Q 900,100 900,40 M 40,650 Q 100,650 100,710 M 960,650 Q 900,650 900,710" fill="none" stroke="#93c5fd" stroke-width="1.5" />

  <!-- Background Watermark Pattern -->
  <g opacity="0.04">
    <circle cx="500" cy="375" r="220" fill="none" stroke="#000000" stroke-width="2" />
    <circle cx="500" cy="375" r="180" fill="none" stroke="#000000" stroke-width="1" />
  </g>

  <!-- Header Section: Digital India & CSC Logo -->
  <!-- Digital India Placeholder Logo -->
  <g transform="translate(80, 55)">
    <path d="M10,40 Q25,10 40,40 T70,40" fill="none" stroke="#059669" stroke-width="6" />
    <path d="M20,45 Q35,15 50,45 T80,45" fill="none" stroke="#ea580c" stroke-width="6" />
    <text x="85" y="32" font-family="'Arial', sans-serif" font-size="22" font-weight="900" fill="#0f172a">Digital India</text>
    <text x="85" y="46" font-family="'Arial', sans-serif" font-size="10" font-weight="bold" fill="#059669" letter-spacing="1">POWER TO EMPOWER</text>
  </g>

  <!-- CSC Logo -->
  <g transform="translate(720, 55)">
    <text x="0" y="42" font-family="'Arial Black', sans-serif" font-size="46" font-weight="900" fill="#0284c7">CSC</text>
    <text x="-15" y="58" font-family="'Arial', sans-serif" font-size="8" font-weight="bold" fill="#334155" letter-spacing="0.5">e-GOVERNANCE SERVICES INDIA LIMITED</text>
  </g>

  <!-- Title -->
  <text x="500" y="210" class="title">Common Service Center</text>

  <!-- Certificate Details Table -->
  <g transform="translate(180, 260)">
    <!-- NAME -->
    <text x="0" y="30" class="label">NAME</text>
    <text x="140" y="30" class="label">:</text>
    <text x="170" y="30" class="value">Wasim Ahmad Khanday</text>

    <!-- D.O.B -->
    <text x="0" y="80" class="label">D.O.B</text>
    <text x="140" y="80" class="label">:</text>
    <text x="170" y="80" class="value">XX-XX-XXXX</text>

    <!-- ADDRESS -->
    <text x="0" y="130" class="label">ADDRESS</text>
    <text x="140" y="130" class="label">:</text>
    <text x="170" y="130" class="value">Anantnag, Anantnag, Jammu And Kashmir</text>

    <!-- CENTER -->
    <text x="0" y="180" class="label">CENTER</text>
    <text x="140" y="180" class="label">:</text>
    <text x="170" y="180" class="value">CSC Service Centre</text>
  </g>

  <!-- Bottom Section: Photo, Ribbon Seal, QR Code, Footer Info -->
  
  <!-- VLE Photo Placeholder Box -->
  <g transform="translate(160, 520)">
    <rect x="0" y="0" width="90" height="110" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
    <circle cx="45" cy="45" r="22" fill="#cbd5e1" />
    <path d="M 15 100 A 30 30 0 0 1 75 100 Z" fill="#94a3b8" />
    <text x="45" y="105" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#475569">VLE PHOTO</text>
  </g>

  <!-- Official Ribbon Seal -->
  <g transform="translate(500, 570)">
    <!-- Ribbon tails -->
    <path d="M -20 20 L -35 60 L -15 50 L 0 60 L 0 20 Z" fill="#2563eb" />
    <path d="M 20 20 L 35 60 L 15 50 L 0 60 L 0 20 Z" fill="#1d4ed8" />
    <!-- Medal Circle -->
    <circle cx="0" cy="0" r="36" fill="#3b82f6" stroke="#1d4ed8" stroke-width="3" />
    <circle cx="0" cy="0" r="28" fill="#ffffff" />
    <!-- Center Icon -->
    <path d="M -12 -5 L 0 -18 L 12 -5 L 6 15 L -6 15 Z" fill="#059669" />
  </g>

  <!-- QR Code Mock Graphic -->
  <g transform="translate(760, 520)">
    <rect x="0" y="0" width="100" height="100" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <!-- Inner QR grid pattern -->
    <rect x="10" y="10" width="25" height="25" fill="#000000" />
    <rect x="15" y="15" width="15" height="15" fill="#ffffff" />
    <rect x="18" y="18" width="9" height="9" fill="#000000" />

    <rect x="65" y="10" width="25" height="25" fill="#000000" />
    <rect x="70" y="15" width="15" height="15" fill="#ffffff" />
    <rect x="73" y="18" width="9" height="9" fill="#000000" />

    <rect x="10" y="65" width="25" height="25" fill="#000000" />
    <rect x="15" y="70" width="15" height="15" fill="#ffffff" />
    <rect x="18" y="73" width="9" height="9" fill="#000000" />

    <!-- Random QR blocks -->
    <rect x="42" y="12" width="12" height="12" fill="#000000" />
    <rect x="42" y="32" width="12" height="20" fill="#000000" />
    <rect x="65" y="42" width="20" height="10" fill="#000000" />
    <rect x="42" y="65" width="15" height="15" fill="#000000" />
    <rect x="65" y="65" width="12" height="20" fill="#000000" />
    <rect x="80" y="80" width="10" height="10" fill="#000000" />
  </g>

  <!-- Registration Date & CSC ID Footer Labels -->
  <text x="80" y="665" font-family="'Arial', sans-serif" font-size="14" font-weight="bold" fill="#000000">Date Of Registration: <tspan font-weight="900">11-11-2020</tspan></text>
  <text x="80" y="688" font-family="'Arial', sans-serif" font-size="11" fill="#475569">System generated certificate signature is not required</text>

  <text x="920" y="665" class="bold-footer" text-anchor="end">CSC ID: 212515670018</text>

  <!-- Middle Legal Disclaimer -->
  <text x="500" y="660" class="footer-text">This is an Electronic certificate issued by <tspan font-weight="bold">CSC E-Governance Services India Limited</tspan>,</text>
  <text x="500" y="675" class="footer-text">Ministry of Electronics and Information Technology,</text>
  <text x="500" y="690" class="footer-text">Government of India, New Delhi</text>

</svg>
